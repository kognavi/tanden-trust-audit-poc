name: AgentCore Runtime Static Check

on:
  pull_request:
    paths:
      - "app/TandenEvidenceDemo/**"
      - "agentcore/**"
      - ".github/workflows/agentcore-runtime-check.yml"
  push:
    branches:
      - main
    paths:
      - "app/TandenEvidenceDemo/**"
      - "agentcore/**"
      - ".github/workflows/agentcore-runtime-check.yml"

permissions:
  contents: read

jobs:
  typecheck:
    name: Type-check minimal AgentCore Runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install Runtime dependencies
        working-directory: app/TandenEvidenceDemo
        run: npm install --ignore-scripts --no-audit --fund=false

      - name: Type-check Runtime
        working-directory: app/TandenEvidenceDemo
        run: npm run typecheck

      - name: Install AgentCore CLI for config validation
        run: npm install --global @aws/agentcore@0.28.1

      - name: Validate AgentCore project config without AWS calls
        run: |
          cp agentcore/aws-targets.example.json agentcore/aws-targets.json
          agentcore validate --json

      - name: Build vendored AgentCore CDK scaffold without AWS calls
        working-directory: agentcore/cdk
        run: |
          npm install --ignore-scripts --no-audit --fund=false
          npm run build

      - name: Synthesize CloudFormation without AWS credentials
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/demo-output/static-cdk.out"
          mkdir -p "$GITHUB_WORKSPACE/demo-output"
          (
            cd agentcore/cdk
            CDK_OUTDIR="$GITHUB_WORKSPACE/demo-output/static-cdk.out" node dist/bin/cdk.js
          )

      - name: Verify least-privilege Runtime policy in synthesized template
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const outDir = path.join(process.cwd(), "demo-output", "static-cdk.out");
          const files = fs.readdirSync(outDir).filter((name) => name.endsWith(".template.json"));
          if (files.length !== 1) {
            throw new Error(`Expected exactly one synthesized template, found ${files.length}`);
          }

          const template = JSON.parse(fs.readFileSync(path.join(outDir, files[0]), "utf8"));
          const policies = Object.values(template.Resources ?? {}).filter(
            (resource) => resource?.Type === "AWS::IAM::Policy"
          );
          if (policies.length !== 1) {
            throw new Error(`Expected exactly one AWS::IAM::Policy, found ${policies.length}`);
          }

          const statements = policies[0]?.Properties?.PolicyDocument?.Statement ?? [];
          const actions = statements.flatMap((statement) =>
            Array.isArray(statement.Action) ? statement.Action : [statement.Action]
          ).filter(Boolean);

          const forbidden = [
            "bedrock:CountTokens",
            "logs:GetLogEvents",
            "logs:FilterLogEvents",
            "logs:PutResourcePolicy",
            "bedrock-agentcore:GetConfigurationBundle",
            "bedrock-agentcore:GetConfigurationBundleVersion",
            "bedrock-agentcore:ListConfigurationBundles",
            "bedrock-agentcore:ListConfigurationBundleVersions",
            "bedrock-agentcore:CreateConfigurationBundle",
            "bedrock-agentcore:UpdateConfigurationBundle",
            "bedrock-agentcore:DeleteConfigurationBundle"
          ];
          for (const action of forbidden) {
            if (actions.includes(action)) {
              throw new Error(`Forbidden broad Runtime permission remains: ${action}`);
            }
          }

          const required = [
            "bedrock:InvokeModel",
            "bedrock:InvokeModelWithResponseStream",
            "xray:PutTraceSegments",
            "xray:PutTelemetryRecords",
            "logs:DescribeLogGroups",
            "logs:CreateLogGroup",
            "logs:DescribeLogStreams",
            "logs:CreateLogStream",
            "logs:PutLogEvents"
          ];
          for (const action of required) {
            if (!actions.includes(action)) {
              throw new Error(`Required Runtime permission missing: ${action}`);
            }
          }

          const policyJson = JSON.stringify(policies[0].Properties.PolicyDocument);
          for (const expected of [
            "inference-profile/jp.amazon.nova-2-lite-v1:0",
            "ap-northeast-1::foundation-model/amazon.nova-2-lite-v1:0",
            "ap-northeast-3::foundation-model/amazon.nova-2-lite-v1:0",
            "/aws/bedrock-agentcore/runtimes/*"
          ]) {
            if (!policyJson.includes(expected)) {
              throw new Error(`Expected scoped policy resource missing: ${expected}`);
            }
          }

          for (const forbiddenResource of ["foundation-model/*", "inference-profile/*"]) {
            if (policyJson.includes(forbiddenResource)) {
              throw new Error(`Broad Bedrock resource remains: ${forbiddenResource}`);
            }
          }

          const wildcardStatements = statements.filter((statement) => statement.Resource === "*");
          const allowedWildcardActions = new Set([
            "xray:PutTraceSegments",
            "xray:PutTelemetryRecords",
            "logs:DescribeLogGroups"
          ]);
          for (const statement of wildcardStatements) {
            const statementActions = Array.isArray(statement.Action) ? statement.Action : [statement.Action];
            for (const action of statementActions) {
              if (!allowedWildcardActions.has(action)) {
                throw new Error(`Unexpected wildcard Resource permission: ${action}`);
              }
            }
          }

          console.log("Least-privilege Runtime policy assertions passed.");
          NODE

      - name: Cleanup temporary AgentCore target
        if: always()
        run: |
          rm -f agentcore/aws-targets.json
          rm -rf demo-output/static-cdk.out

      - name: Verify no AWS credentials are requested
        run: |
          test -z "${AWS_ACCESS_KEY_ID:-}"
          test -z "${AWS_SECRET_ACCESS_KEY:-}"
          test -z "${AWS_SESSION_TOKEN:-}"
