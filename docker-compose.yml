version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: tanden-audit-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: tanden_audit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localdev_only_password
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
